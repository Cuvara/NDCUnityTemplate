name: Generate Docker License

on:
  workflow_dispatch:

jobs:
  generate:
    uses: dyCuong03/unity-build-workflows/.github/workflows/unity-generate-license.yml@main
    with:
      unity-version: ${{ vars.UNITY_VERSION }}
    secrets:
      UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
