name: Unity Build

# Thin caller — delegates ALL orchestration to the toolkit reusable pipeline.
# Edit build logic in: unity-build-workflows/.github/workflows/unity-pipeline.yml
#
# Architecture: see unity-build-workflows/docs/EXPLICIT_PLATFORM_FLOW_SPEC.md
# Branch flow:  see unity-build-workflows/docs/BRANCH_FLOW_CONTRACT.md

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform(s)"
        required: false
        default: All
        type: choice
        options: [All, Android, WebGL, Linux64, LinuxServer, Windows64, iOS]

      environment:
        description: "Build environment (passed to Unity)"
        required: false
        default: production
        type: choice
        options: [production, staging, development]

      run-tests:
        description: "Run EditMode/PlayMode tests before building"
        required: false
        default: false
        type: boolean

      test-mode:
        description: "Test suite to run (only when run-tests=true)"
        required: false
        default: All
        type: choice
        options: [EditMode, PlayMode, All]

      build-addressables:
        description: "Run Addressable build pipeline before platform builds"
        required: false
        default: false
        type: boolean

      activation-strategy:
        description: "Unity license activation strategy (docker lane only)"
        required: false
        default: auto
        type: choice
        options: [auto, manual-license, account, serial, preactivated, none]

      runner-mode:
        description: "Execution lane (legacy — prefer runner-type/build-engine below)"
        required: false
        default: docker
        type: choice
        options: [docker, self-hosted-windows, auto]

      runner-type:
        description: "WHERE the job runs"
        required: false
        default: github-hosted
        type: choice
        options: [github-hosted, self-hosted]

      build-engine:
        description: "HOW Unity builds"
        required: false
        default: docker
        type: choice
        options: [docker, local]

      runner-labels:
        description: "Comma-separated runs-on labels (optional; blank = derived from runner-type)"
        required: false
        default: ''
        type: string

      unity-version:
        description: "Override Unity version (blank = use ProjectSettings/ProjectVersion.txt)"
        required: false
        default: ''
        type: string

      clean-build:
        description: "Clean Build: auto=use BUILD_CLEAN variable, true=force clean, false=force incremental"
        required: false
        default: auto
        type: choice
        options: [auto, true, false]

      android-export:
        description: "Android output: apk (installable) or aab (Play Store bundle)"
        required: false
        default: apk
        type: choice
        options: [apk, aab]

      define-symbols:
        description: "Extra Scripting Define Symbols (';' or ',' separated). Manual builds only — push/PR use *_DEFINE_SYMBOLS repo variables."
        required: false
        default: ''
        type: string

  push:
    branches: [develop, staging, 'release-*']

  pull_request:
    branches: [develop, staging, 'release-*']

concurrency:
  # Include the lane (runner-type + build-engine) in the key so parallel builds
  # of the same platform on different lanes (e.g. github-hosted+docker vs
  # self-hosted+local) don't cancel each other. Push events carry no inputs, so
  # they collapse to 'auto' and keep the original per-platform behaviour.
  group: unity-build-${{ github.ref }}-${{ github.event_name }}-${{ inputs.platform || 'auto' }}-${{ inputs.runner-type || 'auto' }}-${{ inputs.build-engine || 'auto' }}
  cancel-in-progress: true

jobs:
  pipeline:
    uses: Cuvara/unity-build-workflows/.github/workflows/unity-pipeline.yml@main
    secrets: inherit
    with:
      platform:            ${{ inputs.platform            || '' }}
      environment:         ${{ inputs.environment         || '' }}
      run-tests:           ${{ inputs.run-tests           || false }}
      test-mode:           ${{ inputs.test-mode           || '' }}
      build-addressables:  ${{ inputs.build-addressables  || false }}
      activation-strategy: ${{ inputs.activation-strategy || '' }}
      runner-mode:         ${{ inputs.runner-mode         || '' }}
      runner-type:         ${{ inputs.runner-type         || '' }}
      build-engine:        ${{ inputs.build-engine        || '' }}
      runner-labels:       ${{ inputs.runner-labels       || '' }}
      unity-version:       ${{ inputs.unity-version       || '' }}
      clean-build:         ${{ inputs.clean-build         || 'auto' }}
      android-export:      ${{ inputs.android-export      || 'apk' }}
      define-symbols:      ${{ inputs.define-symbols      || '' }}
      project-path:        '.'
      toolkit-ref:         'main'
