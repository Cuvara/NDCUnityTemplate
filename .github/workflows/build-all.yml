# ────────────────────────────────────────────────────────────────────────────
# build-all.yml — Build All
#
# Why this exists as its own workflow: GitHub's workflow_dispatch form has no
# conditional visibility, so a single multi-platform form has to show Android's
# APK/AAB choice to somebody releasing iOS. Splitting the ENTRY POINT — not the
# implementation — is the only way to get a form that shows just the options
# that apply. Every one of these workflows calls the same
# unity-pipeline.yml engine; none of them contains build logic.
#
# Automatic push/PR builds are NOT here — they stay in unity-build.yml, which
# resolves platforms per branch from the *_BUILD_PLATFORMS repository variables.
#
# Multi-platform entry point. Platforms come from the environment's
# *_BUILD_PLATFORMS repository variable (DEVELOP_/STAGING_/RELEASE_), so the set
# is configuration, not a dropdown that can drift from it.
#
# There is deliberately NO Android APK/AAB input here: an output format for one
# platform does not belong on a multi-platform form. The format follows the
# environment — release builds produce an AAB, everything else an APK. Use
# Build Android when you need to override it.
# ────────────────────────────────────────────────────────────────────────────

name: Build All

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "GENERAL · Build environment"
        required: false
        default: 'production'
        type: choice
        options: ['development', 'staging', 'production']

      run-tests:
        description: "QUALITY · Run Unity tests before building (the quality gate)"
        required: false
        default: true
        type: boolean

      test-mode:
        description: "QUALITY · Test suite to run (ignored when run-tests is off)"
        required: false
        default: 'All'
        type: choice
        options: ['EditMode', 'PlayMode', 'All']

      build-addressables:
        description: "CONTENT · Run the Addressable build before the player build"
        required: false
        default: false
        type: boolean

      unity-version:
        description: "UNITY · Unity version override (blank = ProjectVersion.txt)"
        required: false
        default: ''
        type: string

      clean-build:
        description: "UNITY · Clean build (blank = auto: clean for release, incremental otherwise)"
        required: false
        default: 'auto'
        type: choice
        options: ['auto', 'true', 'false']

      define-symbols:
        description: "UNITY · Extra scripting define symbols (';' or ',' separated)"
        required: false
        default: ''
        type: string

      runner-type:
        description: "ADVANCED · WHERE the job runs (auto = RUNNER_TYPE variable)"
        required: false
        default: 'auto'
        type: choice
        options: ['auto', 'github-hosted', 'self-hosted']

      build-engine:
        description: "ADVANCED · HOW Unity builds (auto = BUILD_ENGINE variable)"
        required: false
        default: 'auto'
        type: choice
        options: ['auto', 'docker', 'local']

      activation-strategy:
        description: "ADVANCED · Unity licence activation strategy (docker lane only)"
        required: false
        default: 'auto'
        type: choice
        options: ['auto', 'manual-license', 'account', 'serial', 'preactivated', 'none']

concurrency:
  group: build-all-${{ github.ref }}-${{ inputs.environment }}
  cancel-in-progress: true

jobs:
  # The node name prefixes every node of the called pipeline in the Actions
  # graph, so it is kept short and platform-shaped.
  build:
    name: All
    uses: Cuvara/unity-build-workflows/.github/workflows/unity-pipeline.yml@main
    secrets: inherit
    with:
      platform: All
      environment: ${{ inputs.environment }}
      run-tests: ${{ inputs.run-tests }}
      test-mode: ${{ inputs.test-mode }}
      build-addressables: ${{ inputs.build-addressables }}
      unity-version: ${{ inputs.unity-version }}
      clean-build: ${{ inputs.clean-build }}
      define-symbols: ${{ inputs.define-symbols }}
      runner-type: ${{ inputs.runner-type != 'auto' && inputs.runner-type || '' }}
      build-engine: ${{ inputs.build-engine != 'auto' && inputs.build-engine || '' }}
      activation-strategy: ${{ inputs.activation-strategy }}
      project-path: '.'
      toolkit-ref: 'main'
