# ────────────────────────────────────────────────────────────────────────────
# 21-release-ios.yml — Release / iOS
#
# Release is not another build. The artifact this promotes was produced by
# Build / Release and is IMMUTABLE: nothing here re-runs Unity, so the binary
# QA approved is the binary that ships.
#
#   Build / Release  ->  release-ios-xcodeproj  ->  [this workflow]  ->  store / host
#
# Each platform has its own workflow because the release lifecycles are not the
# same shape. Forcing them into one matrix would mean a job full of
# `if platform == ...`, which is what makes a release pipeline unreadable at the
# moment you most need to read it.
#
# App Store Connect lifecycle: TestFlight internal -> TestFlight external (which
# needs Beta App Review) -> App Store submission, optionally with a phased
# release. None of those phases has an Android equivalent, which is why this is
# its own workflow.
# ────────────────────────────────────────────────────────────────────────────

name: Release / iOS

on:
  workflow_dispatch:
    inputs:
      unity-version:
        description: "GENERAL · Unity version (blank = ProjectVersion.txt)"
        required: false
        default: ''
        type: string

      build-version:
        description: "GENERAL · Version being released, e.g. 1.4.2"
        required: true
        type: string

      artifact-name:
        description: "ARTIFACT · Artifact from a Build / Release run to promote"
        required: false
        default: 'release-ios-xcodeproj'
        type: string

      start-phase:
        description: "PHASE · Where to start. Use a later phase to retry without rebuilding"
        required: false
        default: 'internal'
        type: choice
        options: ['build', 'internal', 'external', 'production']

      dry-run:
        description: "SAFETY · Validate only — do not publish anything"
        required: false
        default: false
        type: boolean

      app-id:
        description: "IOS · App Store Connect app ID"
        required: true
        type: string

      bundle-id:
        description: "IOS · Expected CFBundleIdentifier, checked before upload"
        required: false
        default: ''
        type: string

      phased-release:
        description: "IOS · Enable the 7-day phased release for production"
        required: false
        default: true
        type: boolean

concurrency:
  group: release-ios-xcodeproj-${{ inputs.build-version }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    uses: Cuvara/unity-build-workflows/.github/workflows/pipeline-ios-release.yml@main
    secrets: inherit
    with:
      unity-version: ${{ inputs.unity-version }}
      build-version: ${{ inputs.build-version }}
      version-string: ${{ inputs.build-version }}
      app-id: ${{ inputs.app-id }}
      bundle-id: ${{ inputs.bundle-id }}
      artifact-name: ${{ inputs.artifact-name }}
      start-phase: ${{ inputs.start-phase }}
      phased-release: ${{ inputs.phased-release }}
      dry-run: ${{ inputs.dry-run }}
