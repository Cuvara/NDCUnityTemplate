name: Template Init — Rename project

# Runs once when a new repository is created from this template.
# Replaces all "NDC-Unity-Template" references with the actual repo name
# and commits the result.

on:
  # Auto-trigger when repo is first created from template
  push:
    branches: [main]

  # Manual fallback
  workflow_dispatch:
    inputs:
      project-name:
        description: >
          Override project name (blank = use repository name).
          Example: "My-Awesome-Game"
        required: false
        default: ''
        type: string

jobs:
  rename:
    # Only run when the repo still contains the template marker.
    # This prevents the workflow from running on every push after init.
    if: >-
      contains(github.event_name, 'workflow_dispatch') ||
      (
        github.event_name == 'push' &&
        github.run_number == 1
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history so commit is on top of everything
          fetch-depth: 0

      - name: Check if still a template (guard)
        id: guard
        run: |
          if grep -qE '"projectName": "(NDC-Unity-Template|NDCUnityTemplate)"' BuildConfig/base.json 2>/dev/null; then
            echo "needs_rename=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_rename=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Project already renamed — skipping."
          fi

      - name: Determine project name
        if: steps.guard.outputs.needs_rename == 'true'
        id: name
        run: |
          # Use manual input if provided, otherwise derive from repo name
          INPUT_NAME="${{ inputs.project-name }}"
          if [[ -n "$INPUT_NAME" ]]; then
            PROJECT_NAME="$INPUT_NAME"
          else
            PROJECT_NAME="${{ github.event.repository.name }}"
          fi
          echo "project=$PROJECT_NAME" >> "$GITHUB_OUTPUT"
          echo "owner_repo=${{ github.repository }}" >> "$GITHUB_OUTPUT"
          echo "::notice::Renaming NDC-Unity-Template → $PROJECT_NAME"

      - name: Rename in BuildConfig JSON files
        if: steps.guard.outputs.needs_rename == 'true'
        env:
          PROJECT: ${{ steps.name.outputs.project }}
          OWNER_REPO: ${{ steps.name.outputs.owner_repo }}
        run: |
          OLD_REPO="Cuvara/NDCUnityTemplate"

          for f in BuildConfig/base.json \
                   BuildConfig/development.json \
                   BuildConfig/staging.json \
                   BuildConfig/production.json; do
            [ -f "$f" ] || continue

            # Replace owner/repo in repository URL first (more specific)
            sed -i "s|${OLD_REPO}|${OWNER_REPO}|g" "$f"

            # Replace template name variants (projectName, productName, outputName)
            sed -i "s|NDCUnityTemplate|${PROJECT}|g" "$f"
            sed -i "s|NDC-Unity-Template|${PROJECT}|g" "$f"

            echo "  ✓ $f"
          done

      - name: Rename in ProjectSettings
        if: steps.guard.outputs.needs_rename == 'true'
        env:
          PROJECT: ${{ steps.name.outputs.project }}
        run: |
          TEMPLATE="NDC-Unity-Template"
          FILE="ProjectSettings/ProjectSettings.asset"
          [ -f "$FILE" ] || exit 0
          sed -i "s|${TEMPLATE}|${PROJECT}|g" "$FILE"
          echo "  ✓ $FILE"

      - name: Rename in README
        if: steps.guard.outputs.needs_rename == 'true'
        env:
          PROJECT: ${{ steps.name.outputs.project }}
          OWNER_REPO: ${{ steps.name.outputs.owner_repo }}
        run: |
          OLD_REPO="Cuvara/NDCUnityTemplate"
          FILE="README.md"
          [ -f "$FILE" ] || exit 0

          sed -i "s|${OLD_REPO}|${OWNER_REPO}|g" "$FILE"
          sed -i "s|NDCUnityTemplate|${PROJECT}|g" "$FILE"
          sed -i "s|NDC-Unity-Template|${PROJECT}|g" "$FILE"
          echo "  ✓ $FILE"

      - name: Commit changes
        if: steps.guard.outputs.needs_rename == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "::notice::No changes to commit."
            exit 0
          fi

          git commit -m "chore: rename project from template → ${{ steps.name.outputs.project }}"
          git push

      - name: Add repo to org secrets & variables selected list
        if: steps.guard.outputs.needs_rename == 'true'
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [[ -z "${APP_ID}" || -z "${APP_PRIVATE_KEY}" ]]; then
            echo "::warning::APP_ID or APP_PRIVATE_KEY not set — skipping org access grant."
            exit 0
          fi

          # Generate GitHub App installation token using Node.js (no dependencies)
          BOT_TOKEN=$(node -e "
          const crypto = require('crypto');
          const https  = require('https');

          const APP_ID = process.env.APP_ID;
          const PEM    = process.env.APP_PRIVATE_KEY;
          const ORG    = process.env.GITHUB_REPOSITORY.split('/')[0];

          const now     = Math.floor(Date.now() / 1000);
          const header  = Buffer.from(JSON.stringify({alg:'RS256',typ:'JWT'})).toString('base64url');
          const payload = Buffer.from(JSON.stringify({iat: now-60, exp: now+600, iss: APP_ID})).toString('base64url');
          const signature = crypto.sign('SHA256', Buffer.from(header+'.'+payload), PEM).toString('base64url');
          const jwt = header+'.'+payload+'.'+signature;

          function api(path, token, method='GET', body=null) {
            return new Promise((resolve, reject) => {
              const opts = {
                hostname: 'api.github.com', path, method,
                headers: {
                  'Authorization': 'Bearer '+token,
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'cuvara-bot',
                  'X-GitHub-Api-Version': '2022-11-28'
                }
              };
              const req = https.request(opts, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => resolve({status: res.statusCode, data: JSON.parse(d || '{}')}));
              });
              req.on('error', reject);
              if (body) req.write(JSON.stringify(body));
              req.end();
            });
          }

          (async () => {
            const instRes = await api('/app/installations', jwt);
            const inst = instRes.data.find(i => i.account.login === ORG);
            if (!inst) { console.error('App not installed on '+ORG); process.exit(1); }

            const tokenRes = await api('/app/installations/'+inst.id+'/access_tokens', jwt, 'POST', {});
            if (tokenRes.status !== 201) { console.error('Token error:', JSON.stringify(tokenRes.data)); process.exit(1); }
            console.log(tokenRes.data.token);
          })();
          ")

          if [[ -z "${BOT_TOKEN}" ]]; then
            echo "::warning::Failed to generate bot token — skipping org access grant."
            exit 0
          fi

          export GH_TOKEN="${BOT_TOKEN}"
          REPO="${{ github.repository }}"
          ORG="Cuvara"
          REPO_ID=$(gh api "/repos/${REPO}" --jq '.id')

          if [[ -z "${REPO_ID}" ]]; then
            echo "::warning::Could not get repo ID for ${REPO} — skipping."
            exit 0
          fi

          echo "Repo ID: ${REPO_ID}"

          # Add repo to each org secret's selected list
          echo "Adding ${REPO} to org secrets..."
          SECRETS=$(gh secret list --org "${ORG}" --json name,visibility -q '.[] | select(.visibility=="selected") | .name' 2>/dev/null || echo "")
          for secret in ${SECRETS}; do
            if gh api --method PUT "/orgs/${ORG}/actions/secrets/${secret}/repositories/${REPO_ID}" 2>/dev/null; then
              echo "  ✓ secret: ${secret}"
            else
              echo "  ✗ secret: ${secret} (failed)"
            fi
          done

          # Add repo to each org variable's selected list
          echo "Adding ${REPO} to org variables..."
          VARIABLES=$(gh variable list --org "${ORG}" --json name,visibility -q '.[] | select(.visibility=="selected") | .name' 2>/dev/null || echo "")
          for var in ${VARIABLES}; do
            if gh api --method PUT "/orgs/${ORG}/actions/variables/${var}/repositories/${REPO_ID}" 2>/dev/null; then
              echo "  ✓ variable: ${var}"
            else
              echo "  ✗ variable: ${var} (failed)"
            fi
          done

          echo "Org access grant complete."

      - name: Clone org variables to new repo
        if: steps.guard.outputs.needs_rename == 'true'
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [[ -z "${APP_ID}" || -z "${APP_PRIVATE_KEY}" ]]; then
            echo "::warning::APP_ID or APP_PRIVATE_KEY not set — skipping org variable clone."
            exit 0
          fi

          # Reuse bot token generation
          BOT_TOKEN=$(node -e "
          const crypto = require('crypto');
          const https  = require('https');

          const APP_ID = process.env.APP_ID;
          const PEM    = process.env.APP_PRIVATE_KEY;
          const ORG    = process.env.GITHUB_REPOSITORY.split('/')[0];

          const now     = Math.floor(Date.now() / 1000);
          const header  = Buffer.from(JSON.stringify({alg:'RS256',typ:'JWT'})).toString('base64url');
          const payload = Buffer.from(JSON.stringify({iat: now-60, exp: now+600, iss: APP_ID})).toString('base64url');
          const signature = crypto.sign('SHA256', Buffer.from(header+'.'+payload), PEM).toString('base64url');
          const jwt = header+'.'+payload+'.'+signature;

          function api(path, token, method='GET', body=null) {
            return new Promise((resolve, reject) => {
              const opts = {
                hostname: 'api.github.com', path, method,
                headers: {
                  'Authorization': 'Bearer '+token,
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'cuvara-bot',
                  'X-GitHub-Api-Version': '2022-11-28'
                }
              };
              const req = https.request(opts, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => resolve({status: res.statusCode, data: JSON.parse(d || '{}')}));
              });
              req.on('error', reject);
              if (body) req.write(JSON.stringify(body));
              req.end();
            });
          }

          (async () => {
            const instRes = await api('/app/installations', jwt);
            const inst = instRes.data.find(i => i.account.login === ORG);
            if (!inst) { console.error('App not installed on '+ORG); process.exit(1); }

            const tokenRes = await api('/app/installations/'+inst.id+'/access_tokens', jwt, 'POST', {});
            if (tokenRes.status !== 201) { console.error('Token error:', JSON.stringify(tokenRes.data)); process.exit(1); }
            console.log(tokenRes.data.token);
          })();
          ")

          if [[ -z "${BOT_TOKEN}" ]]; then
            echo "::warning::Failed to generate bot token — skipping org variable clone."
            exit 0
          fi

          export GH_TOKEN="${BOT_TOKEN}"
          REPO="${{ github.repository }}"
          ORG="Cuvara"

          echo "Listing org-level variables from ${ORG}..."
          VARS_JSON=$(gh variable list --org "${ORG}" --json name,value 2>/dev/null || echo "[]")

          COUNT=$(echo "${VARS_JSON}" | jq length)
          if [[ "${COUNT}" -eq 0 ]]; then
            echo "No org variables found — nothing to clone."
            exit 0
          fi

          echo "Cloning ${COUNT} org variable(s) to ${REPO}..."
          echo "${VARS_JSON}" | jq -c '.[]' | while read -r entry; do
            VAR_NAME=$(echo "${entry}" | jq -r '.name')
            VAR_VALUE=$(echo "${entry}" | jq -r '.value')
            if gh variable set "${VAR_NAME}" --repo "${REPO}" --body "${VAR_VALUE}"; then
              echo "  ✓ ${VAR_NAME}"
            else
              echo "  ✗ ${VAR_NAME} (failed)"
            fi
          done

          echo "Org variable clone complete."

      - name: Create GitHub Environments
        if: steps.guard.outputs.needs_rename == 'true'
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [[ -z "${APP_ID}" || -z "${APP_PRIVATE_KEY}" ]]; then
            echo "::warning::APP_ID or APP_PRIVATE_KEY not set — skipping environment creation."
            exit 0
          fi

          # Generate GitHub App installation token
          BOT_TOKEN=$(node -e "
          const crypto = require('crypto');
          const https  = require('https');

          const APP_ID = process.env.APP_ID;
          const PEM    = process.env.APP_PRIVATE_KEY;
          const ORG    = process.env.GITHUB_REPOSITORY.split('/')[0];

          const now     = Math.floor(Date.now() / 1000);
          const header  = Buffer.from(JSON.stringify({alg:'RS256',typ:'JWT'})).toString('base64url');
          const payload = Buffer.from(JSON.stringify({iat: now-60, exp: now+600, iss: APP_ID})).toString('base64url');
          const signature = crypto.sign('SHA256', Buffer.from(header+'.'+payload), PEM).toString('base64url');
          const jwt = header+'.'+payload+'.'+signature;

          function api(path, token, method='GET', body=null) {
            return new Promise((resolve, reject) => {
              const opts = {
                hostname: 'api.github.com', path, method,
                headers: {
                  'Authorization': 'Bearer '+token,
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'cuvara-bot',
                  'X-GitHub-Api-Version': '2022-11-28'
                }
              };
              const req = https.request(opts, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => resolve({status: res.statusCode, data: JSON.parse(d || '{}')}));
              });
              req.on('error', reject);
              if (body) req.write(JSON.stringify(body));
              req.end();
            });
          }

          (async () => {
            const instRes = await api('/app/installations', jwt);
            const inst = instRes.data.find(i => i.account.login === ORG);
            if (!inst) { console.error('App not installed on '+ORG); process.exit(1); }

            const tokenRes = await api('/app/installations/'+inst.id+'/access_tokens', jwt, 'POST', {});
            if (tokenRes.status !== 201) { console.error('Token error:', JSON.stringify(tokenRes.data)); process.exit(1); }
            console.log(tokenRes.data.token);
          })();
          ")

          if [[ -z "${BOT_TOKEN}" ]]; then
            echo "::warning::Failed to generate bot token — skipping environment creation."
            exit 0
          fi

          REPO="${{ github.repository }}"

          create_environment() {
            local ENV_NAME="$1"
            echo "Creating environment: ${ENV_NAME}..."
            local STATUS
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X PUT \
              -H "Authorization: Bearer ${BOT_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/environments/${ENV_NAME}" \
              -d '{"deployment_branch_policy":{"protected_branches":false,"custom_branch_policies":true}}')
            if [[ "${STATUS}" =~ ^2 ]]; then
              echo "  ✓ ${ENV_NAME} (HTTP ${STATUS})"
            else
              echo "  ✗ ${ENV_NAME} (HTTP ${STATUS})"
            fi
          }

          add_branch_policy() {
            local ENV_NAME="$1"
            local BRANCH_PATTERN="$2"
            local STATUS
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${BOT_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/environments/${ENV_NAME}/deployment-branch-policies" \
              -d "{\"name\":\"${BRANCH_PATTERN}\",\"type\":\"branch\"}")
            if [[ "${STATUS}" =~ ^2 ]]; then
              echo "    ✓ branch policy: ${BRANCH_PATTERN}"
            else
              echo "    ✗ branch policy: ${BRANCH_PATTERN} (HTTP ${STATUS})"
            fi
          }

          # Create environments
          create_environment "development"
          add_branch_policy "development" "develop"

          create_environment "staging"
          add_branch_policy "staging" "staging"

          create_environment "production"
          add_branch_policy "production" "main"
          add_branch_policy "production" "release-*"

          echo "Environment creation complete."

      - name: Create setup checklist issue
        if: steps.guard.outputs.needs_rename == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create label first (ignore error if it already exists)
          gh label create "setup" --description "Initial project setup" --color "0E8A16" 2>/dev/null || true

          gh issue create \
            --title "Setup: Configure secrets & variables for ${{ steps.name.outputs.project }}" \
            --label "setup" \
            --body "$(cat <<'ISSUE_BODY'
          ## Project initialized from NDC-Unity-Template

          The project has been renamed automatically. You now need to configure
          the **secrets** and **variables** required by the CI/CD pipelines.

          > **Why can't these be copied automatically?**
          > GitHub does not allow reading secret values via API — this is a security
          > feature. Variables *could* be copied, but they often need project-specific
          > values (e.g. `UNITY_VERSION`), so a manual checklist is safer.

          ---

          ### Repository Variables

          Go to **Settings → Secrets and variables → Actions → Variables** and create:

          | Variable | Example | Description |
          |----------|---------|-------------|
          | `UNITY_VERSION` | `2022.3.20f1` | Unity editor version for all CI jobs |

          ---

          ### Repository Secrets (required)

          Go to **Settings → Secrets and variables → Actions → Secrets** and create:

          #### Unity License
          - [ ] `UNITY_LICENSE` — Contents of your `.ulf` license file
          - [ ] `UNITY_EMAIL` — Unity account email
          - [ ] `UNITY_PASSWORD` — Unity account password
          - [ ] `UNITY_SERIAL` — *(Pro/Plus only)* Serial key

          #### Android Signing
          - [ ] `ANDROID_KEYSTORE_BASE64` — Base64-encoded `.keystore` file
          - [ ] `ANDROID_KEYSTORE_PASS` — Keystore password
          - [ ] `ANDROID_KEY_ALIAS` — Key alias name
          - [ ] `ANDROID_KEY_PASS` — Key password

          #### iOS Distribution *(optional — skip if not building iOS)*
          - [ ] `IOS_DISTRIBUTION_CERTIFICATE_BASE64`
          - [ ] `IOS_DISTRIBUTION_CERTIFICATE_PASSWORD`
          - [ ] `IOS_PROVISIONING_PROFILE_BASE64`
          - [ ] `APP_STORE_CONNECT_KEY_ID`
          - [ ] `APP_STORE_CONNECT_ISSUER_ID`
          - [ ] `APP_STORE_CONNECT_PRIVATE_KEY`

          #### WebGL / Cloudflare Pages *(optional)*
          - [ ] `CLOUDFLARE_API_TOKEN`
          - [ ] `CLOUDFLARE_ACCOUNT_ID`

          #### Google Play *(optional)*
          - [ ] `GOOGLE_PLAY_SERVICE_ACCOUNT_JSON`

          #### Discord Notifications *(optional)*
          - [ ] `DISCORD_WEBHOOK_URL`

          ---

          ### Quick setup with `gh` CLI

          If you have the secrets on hand, you can set them in bulk:

          ```bash
          # Variables
          gh variable set UNITY_VERSION --body "2022.3.20f1"

          # Required secrets
          gh secret set UNITY_LICENSE < Unity_lic.ulf
          gh secret set UNITY_EMAIL
          gh secret set UNITY_PASSWORD

          # Android signing
          base64 -w0 release.keystore | gh secret set ANDROID_KEYSTORE_BASE64
          gh secret set ANDROID_KEYSTORE_PASS
          gh secret set ANDROID_KEY_ALIAS
          gh secret set ANDROID_KEY_PASS
          ```

          ---

          ### Organization-level secrets (recommended)

          If multiple repos share the same Unity license or Android keystore,
          consider setting these as **organization secrets** instead:

          **Settings → Organization → Secrets and variables → Actions**

          This way, every repo created from the template inherits them automatically.

          ---

          Close this issue once all required secrets are configured and a test build passes.
          ISSUE_BODY
          )"
