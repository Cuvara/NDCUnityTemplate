name: Unity CI

# Simplified multi-platform Unity build.
#
# Delegates to unity-build-multi.yml in the toolkit.
# Graph (executed by the toolkit, once per run):
#
#   Detect & Platform Select  (once, ubuntu-latest)
#         ↓
#   Validate Common           (once, ubuntu-latest + Docker)
#         ↓
#   Test Common               (once, ubuntu-latest + Docker)
#         ↓
#   ┌─────────────────────────────────┐   ┌──────────────────────┐
#   │ Build Docker Platforms (matrix) │   │ Build iOS            │
#   │  ├── Android                    │   │ (macOS native runner) │
#   │  ├── WebGL                      │   └──────────────────────┘
#   │  └── Linux64 / LinuxServer      │
#   └─────────────────────────────────┘
#         ↓
#   Final Report              (once, if: always)
#
# Detect / Validate / Test run ONCE regardless of selected platforms.
# Docker platforms share a fail-fast:false matrix job.
# iOS is separate (requires self-hosted macOS runner: macos-unity-xcode).
#
# ── Required secrets (Settings → Secrets and variables → Actions) ──────────
#   UNITY_LICENSE / UNITY_EMAIL + UNITY_PASSWORD  (all platforms)
#   ANDROID_KEYSTORE_BASE64, _PASS, _ALIAS, _KEY_PASS  (Android signing)
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON               (Android → Google Play)
#   CLOUDFLARE_API_TOKEN, _ACCOUNT_ID              (WebGL → Cloudflare)
#   IOS_DISTRIBUTION_CERTIFICATE_BASE64, _PASSWORD
#   IOS_PROVISIONING_PROFILE_BASE64                (iOS signing)
#   APP_STORE_CONNECT_KEY_ID, _ISSUER_ID, _PRIVATE_KEY  (iOS → TestFlight)
#   DISCORD_WEBHOOK_URL                            (notifications, optional)

on:
  # Legacy custom-toolkit Docker path — superseded by unity-build.yml (GameCI
  # delegation). Manual-only: the auto push/PR triggers were removed so it no
  # longer runs (and fails on Personal-license activation) alongside the new
  # explicit-platform workflow. Kept for reference / Pro-license use.
  workflow_dispatch:
    inputs:
      platform:
        description: Platform(s) to build
        required: false
        default: Android
        type: choice
        options:
          - All
          - Android
          - WebGL
          - Linux64
          - LinuxServer
          - iOS
      environment:
        description: Target environment
        required: false
        default: development
        type: choice
        options: [development, staging, production]
      release-mode:
        description: Release mode (digest-pinned image, signing enforced)
        required: false
        default: false
        type: boolean
      clean-build:
        description: Force full reimport (delete Library/)
        required: false
        default: false
        type: boolean
      build-addressables:
        description: Build Addressables before player build
        required: false
        default: true
        type: boolean
      test-level:
        description: Test scope
        required: false
        default: editmode
        type: choice
        options: [none, editmode, playmode, full]

jobs:
  build:
    name: Unity Build
    uses: dyCuong03/unity-build-workflows/.github/workflows/unity-build-multi.yml@main
    with:
      # On push/PR default to Android; on workflow_dispatch use selected platform.
      platform: >-
        ${{
          github.event_name == 'workflow_dispatch' && inputs.platform ||
          'Android'
        }}

      project-path:      '.'
      unity-version:     '6000.0.26f1'

      # Auto-derive environment from branch when not explicitly set.
      environment: >-
        ${{
          github.event_name == 'workflow_dispatch' && inputs.environment ||
          github.ref_name == 'main' && 'production' ||
          startsWith(github.ref_name, 'release-') && 'staging' ||
          github.ref_name == 'staging' && 'staging' ||
          'development'
        }}

      build-config-path:  BuildConfig
      test-level: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.test-level || 'editmode' }}
      cache-mode:         safe
      build-addressables: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.build-addressables || true }}
      clean-build: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.clean-build || false }}
      upload-artifact:    true
      artifact-retention-days: 14
      release-mode: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.release-mode || false }}
      deploy-target:      none

      # Docker image config (hosted in GHCR under dycuong03 namespace).
      image-registry:     ghcr.io
      image-namespace:    dycuong03
      image-name:         unity-editor

      # iOS: self-hosted macOS runner with Unity iOS Build Support + Xcode.
      ios-runner-label:   macos-unity-xcode

      # Toolkit wiring — must match the @ref in the 'uses:' line above.
      workflow-repository: dyCuong03/unity-build-workflows
      workflow-ref:        main
      integration-mode:   remote
      toolkit-path:       unity-build-workflows

    secrets:
      UNITY_LICENSE:                    ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL:                      ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD:                   ${{ secrets.UNITY_PASSWORD }}
      ANDROID_KEYSTORE_BASE64:          ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASS:            ${{ secrets.ANDROID_KEYSTORE_PASS }}
      ANDROID_KEY_ALIAS:                ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASS:                 ${{ secrets.ANDROID_KEY_PASS }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      CLOUDFLARE_API_TOKEN:             ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID:            ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      IOS_DISTRIBUTION_CERTIFICATE_BASE64:   ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64:       ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      APP_STORE_CONNECT_KEY_ID:              ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID:           ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY:         ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      DISCORD_WEBHOOK_URL:                   ${{ secrets.DISCORD_WEBHOOK_URL }}
