name: Unity CI

# Docker-only caller workflow. Delegates to the reusable workflows in
# dyCuong03/unity-build-workflows. All Unity operations run inside containers.
#
# Required secrets (repo Settings → Secrets and variables → Actions):
#   UNITY_LICENSE     — Unity .ulf license content (base64), OR
#   UNITY_EMAIL / UNITY_PASSWORD — account activation
#
# Platform-specific secrets:
#   Android sign:   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASS, ANDROID_KEY_ALIAS, ANDROID_KEY_PASS
#   WebGL deploy:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: false
        default: development
        type: choice
        options: [development, staging, production]
      target-platform:
        description: Platform to build
        required: false
        default: Android
        type: choice
        options: [Android, WebGL, Linux64, LinuxServer]

jobs:
  # ── Android (Docker, ubuntu-latest) ─────────────────────────────────────
  build-android:
    name: Android
    if: ${{ inputs.target-platform == 'Android' || github.event_name != 'workflow_dispatch' }}
    uses: dyCuong03/unity-build-workflows/.github/workflows/unity-build.yml@main
    with:
      project-path: '.'
      unity-version: '6000.0.26f1'
      target-platform: Android
      environment: ${{ inputs.environment || 'development' }}
      build-config-path: BuildConfig
      test-level: editmode
      cache-mode: safe
      build-addressables: true
      upload-artifact: true
      deploy-target: none
      release-mode: false
    secrets:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}

  # ── WebGL (Docker, ubuntu-latest) ───────────────────────────────────────
  build-webgl:
    name: WebGL
    if: ${{ inputs.target-platform == 'WebGL' }}
    uses: dyCuong03/unity-build-workflows/.github/workflows/unity-build.yml@main
    with:
      project-path: '.'
      unity-version: '6000.0.26f1'
      target-platform: WebGL
      environment: ${{ inputs.environment || 'development' }}
      build-config-path: BuildConfig
      test-level: editmode
      cache-mode: safe
      build-addressables: true
      upload-artifact: true
      deploy-target: none
      release-mode: false
    secrets:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── Linux64 / LinuxServer (Docker, ubuntu-latest) ───────────────────────
  build-linux:
    name: Linux
    if: ${{ inputs.target-platform == 'Linux64' || inputs.target-platform == 'LinuxServer' }}
    uses: dyCuong03/unity-build-workflows/.github/workflows/unity-build.yml@main
    with:
      project-path: '.'
      unity-version: '6000.0.26f1'
      target-platform: ${{ inputs.target-platform || 'Linux64' }}
      environment: ${{ inputs.environment || 'development' }}
      build-config-path: BuildConfig
      test-level: editmode
      cache-mode: safe
      build-addressables: true
      upload-artifact: true
      release-mode: false
    secrets:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
